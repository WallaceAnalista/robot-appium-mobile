name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_URL: https://github.com/saucelabs/my-demo-app-rn/releases/download/v1.3.0/iOS-Simulator-MyRNDemoApp.1.3.0-162.zip

jobs:
  ios:
    name: Robot + Appium (simulador iOS)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Instalar Robot Framework e Appium
        run: |
          pip install -r requirements.txt
          npm install -g appium
          appium driver install xcuitest

      - name: Baixar o app (build para simulador)
        run: |
          mkdir -p apps
          curl -sSL -o apps/app.zip "$APP_URL"
          unzip -q apps/app.zip -d apps
          APP=$(find apps -maxdepth 3 -name "*.app" -type d | head -n 1)
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          echo "App: $APP"

      - name: Escolher um simulador de iPhone disponível
        run: |
          python3 - <<'EOF' >> "$GITHUB_ENV"
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime, devices in sorted(data["devices"].items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d["name"].startswith("iPhone"):
                      version = runtime.split("iOS-")[1].replace("-", ".")
                      print(f"DEVICE_NAME={d['name']}")
                      print(f"PLATFORM_VERSION={version}")
                      raise SystemExit
          EOF
          cat "$GITHUB_ENV"

      - name: Iniciar o servidor Appium
        run: |
          mkdir -p results
          nohup appium --log results/appium.log --log-timestamp > /dev/null 2>&1 &
          npx --yes wait-on --timeout 60000 http-get://127.0.0.1:4723/status

      - name: Rodar testes no simulador
        run: robot -V config/capabilities.py:ios -d results --name "iOS" tests

      - name: Publicar relatório
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-robot-ios
          path: results/
          retention-days: 14
